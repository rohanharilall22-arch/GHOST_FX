<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GHOST_FX | Login</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(
        circle at center,
        #17133b 0%,
        #05070d 55%
      );
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: #0b0e16;
      border: 1px solid #252b3b;
      border-radius: 16px;
    }

    .auth-card h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .auth-card > p {
      text-align: center;
      color: #858da1;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .auth-logo {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    .auth-logo span {
      color: #7c5cff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: #aeb5c7;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      background: #070a11;
      border: 1px solid #292f40;
      border-radius: 8px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #7c5cff;
    }

    .login-button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 8px;
      background: #7c5cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-button:hover {
      background: #9278ff;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #111522;
      color: #aeb5c7;
      font-size: 13px;
      text-align: center;
    }

    .auth-links {
      text-align: center;
      margin-top: 22px;
      color: #777f93;
      font-size: 13px;
    }

    .auth-links a {
      color: #9d8cff;
      text-decoration: none;
    }

    .demo-note {
      margin-top: 22px;
      padding: 12px;
      border: 1px solid #30265f;
      background: #100d20;
      color: #aaa0d8;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">
      GHOST<span>_FX</span>
    </div>

    <a href="index.html" class="nav-button">
      Home
    </a>
  </nav>


  <main class="auth-page">

    <div class="auth-card">

      <div class="auth-logo">
        GHOST<span>_FX</span>
      </div>

      <h1>Welcome Back</h1>

      <p>
        Sign in to access your GHOST_FX workspace.
      </p>


      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>


        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>


        <button type="submit" class="login-button">
          Sign In
        </button>

      </form>


      <div id="loginMessage" class="message"></div>


      <div class="auth-links">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </div>


      <div class="demo-note">
        Demo interface only. Real account authentication will be
        connected through a secure backend.
      </div>

    </div>

  </main>


  <footer>
    © 2026 GHOST_FX — Educational market-analysis platform.
  </footer>


  <script src="script.js"></script>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      loginMessage.style.display = "block";
      loginMessage.textContent =
        "Demo login submitted. Secure authentication will be connected later.";
    });
  </script>

</body>
</html>
