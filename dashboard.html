<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GHOST_FX | Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .dashboard-page {
      min-height: 100vh;
      padding: 35px 6%;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #858da1;
      font-size: 14px;
    }

    .status {
      padding: 9px 14px;
      border: 1px solid #263044;
      border-radius: 20px;
      color: #55d68b;
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #0b0e16;
      border: 1px solid #1d2331;
      border-radius: 14px;
      padding: 20px;
    }

    .stat-card small {
      color: #777f93;
    }

    .stat-card h2 {
      margin-top: 10px;
      font-size: 25px;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .dashboard-panel {
      background: #0b0e16;
      border: 1px solid #1d2331;
      border-radius: 14px;
      padding: 24px;
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-heading h3 {
      font-size: 17px;
    }

    .panel-heading span {
      color: #777f93;
      font-size: 12px;
    }

    .signal {
      padding: 18px;
      border: 1px solid #292348;
      background: #0e1020;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .signal-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .signal-pair {
      font-weight: bold;
    }

    .signal-type {
      color: #55d68b;
      font-size: 12px;
    }

    .signal p {
      color: #929aad;
      font-size: 13px;
      line-height: 1.6;
    }

    .watchlist {
      list-style: none;
    }
